[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "printmaster-studio"
version = "0.1.0"
description = "Preparación automática de imágenes y PDF de gran formato para Epson SC-T3170"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
  "Pillow>=10.3",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pikepdf>=9.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-qt>=4.4",
  "hypothesis>=6.100",
  "pypdf>=4.2",
  "ruff>=0.5",
  "psutil>=5.9",
]

[project.scripts]
printmaster = "printmaster.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/printmaster"]

[tool.hatch.build]
include = ["src/printmaster/**/*.py", "src/printmaster/**/*.json", "src/printmaster/**/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["ui: pruebas de interfaz"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
